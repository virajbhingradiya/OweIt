spring.application.name=oweit-api

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Errors come back as RFC 9457 JSON (ProblemDetail), not HTML pages.
spring.mvc.problemdetails.enabled=true

# Keep the dev DB container running between app restarts.
spring.docker.compose.lifecycle-management=start-only

# Only health and info are public. Liveness/readiness for Docker/Kubernetes.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Production: set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD as env vars.

# Local secrets live in backend/.env (git-ignored). See .env.example.
spring.config.import=optional:file:.env[.properties]

# Clerk: verify session tokens. CLERK_ISSUER is your Clerk Frontend API URL.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${CLERK_ISSUER}
# Comma-separated origins allowed to use the API (matched against the token's azp claim).
clerk.authorized-parties=${CLERK_AUTHORIZED_PARTIES:http://localhost:5173}
# Clerk session token carries {"role": "admin"} (from user public metadata) -> Spring role ROLE_admin.
spring.security.oauth2.resourceserver.jwt.authorities-claim-name=role
spring.security.oauth2.resourceserver.jwt.authority-prefix=ROLE_
