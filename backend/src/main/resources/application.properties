spring.application.name=oweit-api

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Errors come back as RFC 9457 JSON (ProblemDetail), not HTML pages.
spring.mvc.problemdetails.enabled=true

# Keep the dev DB container running between app restarts.
spring.docker.compose.lifecycle-management=start-only

# Only health and info are public. Liveness/readiness for Docker/Kubernetes.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Production: set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD as env vars.
