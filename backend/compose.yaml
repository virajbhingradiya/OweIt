# Local dev database. Spring Boot starts this automatically on `./mvnw spring-boot:run`.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: oweit
      POSTGRES_USER: oweit
      POSTGRES_PASSWORD: oweit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
